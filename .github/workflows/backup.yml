name: Database backup

# A daily copy of the Supabase database (schema, data and roles), encrypted and kept 30 days.
# Restore steps: docs/backup-restore.md. Needs two repository secrets:
#   SUPABASE_DB_URL     the database connection string (Session pooler, with the password)
#   BACKUP_PASSPHRASE   a long passphrase; keep a copy outside GitHub, it is needed to restore

on:
  schedule:
    # 21:37 UTC is 03:07 in India, when almost nobody is logging.
    - cron: '37 21 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check the secrets are set
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::Add SUPABASE_DB_URL and BACKUP_PASSPHRASE in Settings > Secrets and variables > Actions."
            exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Dump the database
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          mkdir backup
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/roles.sql --role-only
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/schema.sql
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/data.sql --use-copy --data-only
          # An empty dump means something went wrong, not that there is nothing to keep.
          test -s backup/schema.sql
          test -s backup/data.sql
          ls -la backup
      - name: Compress and encrypt
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          name="macrotrophy-$(date -u +%Y-%m-%d)"
          tar -czf "$name.tar.gz" -C backup .
          gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" \
            --symmetric --cipher-algo AES256 -o "$name.tar.gz.gpg" "$name.tar.gz"
          # Nothing readable is uploaded.
          rm -rf backup "$name.tar.gz"
          echo "BACKUP_FILE=$name.tar.gz.gpg" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BACKUP_FILE }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 30
          if-no-files-found: error
